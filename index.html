<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyTrack</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: min(800px, 90vw);
            max-height: 90vh;
            padding: 20px;
        }

        .archive {
            width: 100%;
            height: 100%;
        }

        .versions {
            display: grid;
            /* Creates a responsive grid with minimum 120px wide columns */
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 16px;
            width: 100%;
            padding: 20px 0;
        }

        .version {
            width: 100%;
            padding: 20px 10px;

            border: 1px solid #222;
            border-radius: 8px;
            background: #111;

            color: #666;

            font: inherit;
            font-size: clamp(18px, 2.5vw, 24px);
            font-weight: 500;
            letter-spacing: -0.02em;
            text-align: center;

            cursor: pointer;
            outline: none;
            user-select: none;

            transition:
                color 180ms ease,
                background 180ms ease,
                border-color 180ms ease,
                transform 180ms ease;
        }

        .version.selected {
            color: #fff;
            background: #222;
            border-color: #fff;
            transform: scale(1.05);
        }

        .version:hover {
            color: #aaa;
            border-color: #444;
        }

        .version.selected:hover {
            color: #fff;
            border-color: #fff;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="archive" id="archive">
            <div class="versions" id="versions">
                <button class="version" data-version="0.1.1">0.1.1</button>
                <button class="version" data-version="0.2.0">0.2.0</button>
                <button class="version" data-version="0.3.0">0.3.0</button>
                <button class="version" data-version="0.3.1">0.3.1</button>
                <button class="version" data-version="0.4.0">0.4.0</button>
                <button class="version" data-version="0.4.1">0.4.1</button>
                <button class="version" data-version="0.4.2">0.4.2</button>
                <button class="version" data-version="0.5.0">0.5.0</button>
                <button class="version" data-version="0.5.1">0.5.1</button>
                <button class="version" data-version="0.5.2">0.5.2</button>
                <button class="version" data-version="0.6.0">0.6.0</button>
                <button class="version" data-version="0.6.1">0.6.1</button>
                <button class="version" data-version="0.6.2">0.6.2</button>
                <button class="version" data-version="0.6.3">0.6.3</button>
            </div>
        </div>
    </main>

    <script>
        const versionsContainer = document.getElementById("versions");
        const versions = [...document.querySelectorAll(".version")];
        let selected = 0;

        // Helper to dynamically calculate current grid columns
        function getGridColumns() {
            const computedStyle = window.getComputedStyle(versionsContainer);
            return computedStyle.gridTemplateColumns.split(" ").length;
        }

        function update() {
            versions.forEach((element, index) => {
                element.classList.toggle("selected", index === selected);
            });
        }

        function moveSelection(direction) {
            const next = selected + direction;
            if (next >= 0 && next < versions.length) {
                selected = next;
                update();
            }
        }

        function openSelected() {
            const version = versions[selected].dataset.version;
            window.location.href = `${version}/index.html`;
        }

        // Mouse Wheel scrolls sequentially through grid items
        document.addEventListener("wheel", (event) => {
            event.preventDefault();
            if (event.deltaY > 0) {
                moveSelection(1);
            } else if (event.deltaY < 0) {
                moveSelection(-1);
            }
        }, { passive: false });

        // Click interaction
        versions.forEach((element, index) => {
            element.addEventListener("click", () => {
                selected = index;
                update();
                openSelected();
            });
        });

        // 2D Grid Keyboard navigation mapping
        document.addEventListener("keydown", (event) => {
            const cols = getGridColumns();

            if (event.key === "ArrowRight") {
                event.preventDefault();
                moveSelection(1);
            }
            if (event.key === "ArrowLeft") {
                event.preventDefault();
                moveSelection(-1);
            }
            if (event.key === "ArrowDown") {
                event.preventDefault();
                moveSelection(cols); // jump to next row down
            }
            if (event.key === "ArrowUp") {
                event.preventDefault();
                moveSelection(-cols); // jump to row above
            }
            if (event.key === "Enter") {
                event.preventDefault();
                openSelected();
            }
            if (event.key === "Home") {
                event.preventDefault();
                selected = 0;
                update();
            }
            if (event.key === "End") {
                event.preventDefault();
                selected = versions.length - 1;
                update();
            }
        });

        update();
    </script>
</body>
</html>
